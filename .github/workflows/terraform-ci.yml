name: Terraform CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - prod

      destructive_test:
        description: "Test destructive-plan blocker"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Run Trivy Terraform Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: "HIGH,CRITICAL"

  dev-plan:
    name: Terraform Dev Plan
    runs-on: ubuntu-latest
    needs: terraform-checks

    if: >
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_environment: dev
      TF_VAR_instance_name: terraform-devops-vm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Dev Workspace
        run: terraform workspace select default

      - name: Terraform Dev Plan
        run: terraform plan -input=false -no-color -out=dev.tfplan

      - name: Upload Dev Plan
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: dev.tfplan
          retention-days: 1

  prod-plan:
    name: Terraform Prod Plan
    runs-on: ubuntu-latest
    needs: terraform-checks

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'prod'

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_WORKSPACE: prod
      TF_VAR_environment: prod
      TF_VAR_instance_name: terraform-prod-vm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_PLAN_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Prod Plan
        run: |
          if [ "${{ inputs.destructive_test }}" = "true" ]; then
            echo "Running SAFE destructive-plan test."

            terraform plan \
              -input=false \
              -no-color \
              -replace='google_compute_firewall.dynamic_demo' \
              -out=prod.tfplan
          else
            terraform plan \
              -input=false \
              -no-color \
              -out=prod.tfplan
          fi

      - name: Enforce Production Security Policy
        run: |
          terraform show -json prod.tfplan > prod-policy-plan.json

          PUBLIC_IP_COUNT=$(jq '
            [
              .planned_values.root_module.child_modules[]?.resources[]?
              | select(.type == "google_compute_instance")
              | .values.network_interface[]?
              | .access_config[]?
            ]
            | length
          ' prod-policy-plan.json)

          if [ "$PUBLIC_IP_COUNT" -gt 0 ]; then
            echo "ERROR: Production VM has a public IP configuration."
            exit 1
          fi

          echo "Production policy passed: no public VM IP detected."

      - name: Enforce Production Deletion Protection
        run: |
          terraform show -json prod.tfplan > prod-deletion-policy.json

          UNPROTECTED=$(jq '
            [
              .planned_values.root_module.child_modules[]?.resources[]?
              | select(.type == "google_compute_instance")
              | select(.values.deletion_protection != true)
            ]
            | length
          ' prod-deletion-policy.json)

          if [ "$UNPROTECTED" -gt 0 ]; then
            echo "ERROR: Production VM deletion protection is not enabled."
            exit 1
          fi

          echo "Production policy passed: deletion protection enabled."

      - name: Block Destructive Prod Changes
        run: |
          terraform show -json prod.tfplan > prod-plan.json

          if jq -e '
            [
              .resource_changes[]?
              | select(.change.actions | index("delete"))
            ]
            | length > 0
          ' prod-plan.json > /dev/null; then

            echo "ERROR: Destructive Terraform actions detected in production plan."
            echo "Affected resources:"

            jq -r '
              .resource_changes[]?
              | select(.change.actions | index("delete"))
              | "\(.address) -> \(.change.actions | join(","))"
            ' prod-plan.json

            exit 1
          fi

          echo "No destructive production actions detected."

      - name: Upload Prod Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-prod-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: prod.tfplan
          retention-days: 1

  dev-apply:
    name: Terraform Dev Apply
    runs-on: ubuntu-latest
    needs:
      - terraform-checks
      - dev-plan

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'dev'

    environment:
      name: dev-apply

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_VAR_environment: dev
      TF_VAR_instance_name: terraform-devops-vm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLY_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Select Dev Workspace
        run: terraform workspace select default

      - name: Download Dev Plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-dev-plan-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Terraform Dev Apply
        run: terraform apply -input=false dev.tfplan

  prod-apply:
    name: Terraform Prod Apply
    runs-on: ubuntu-latest
    needs:
      - terraform-checks
      - prod-plan

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.environment == 'prod'

    environment:
      name: prod-apply

    permissions:
      contents: read
      id-token: write

    env:
      TF_IN_AUTOMATION: true
      TF_WORKSPACE: prod
      TF_VAR_environment: prod
      TF_VAR_instance_name: terraform-prod-vm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Prod Plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-prod-plan-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Terraform Prod Apply
        run: terraform apply -input=false prod.tfplan
